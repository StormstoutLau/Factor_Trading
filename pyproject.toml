[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-trading-v3"
version = "3.0.0"
description = "Factor Trading v3.0 - A professional quantitative backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Factor Trading v3.0 Team"}
]
keywords = ["quantitative", "trading", "backtesting", "factor", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "cvxpy>=1.2.0",
    "pydantic>=2.0.0",
    "ta>=0.11.0",
    "tushare>=1.2.0",
    "akshare>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "plotly>=5.14.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.5.0",
    "celery>=5.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
factor-trading = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black~=26.0",
    "flake8>=6.0.0",
    # P-036 B0：mypy 钉到 2.4.x。门禁读数对 minor 版本敏感——同一配置下
    # 2.1.0 的 `core` 为 0 error，2.4.1 为 21 error（被 follow 的 filter/ 上报），
    # 见 docs/RESEARCH_p036_mypy_check_surface_expansion.md R1。升级须显式提交。
    "mypy~=2.4.1",
    "isort>=5.12.0",
]
web = [
    "streamlit>=1.28.0",
]

[project.urls]
"Homepage" = "https://github.com/StormstoutLau/Factor_Trading"
"Repository" = "https://github.com/StormstoutLau/Factor_Trading"
"Issues" = "https://github.com/StormstoutLau/Factor_Trading/issues"

[tool.setuptools]
# TD-1.2 (ADR-016): 最小子包化 — 只声明 factor_pipeline 实际依赖的包
# (根 + core, data_v3 位于 core/ 下). 其他子包 (agents/filter/etc.) 可在
# 需要时追加. Factor_Trading_v3.0 自身仍可在 cwd 下用 `from core.X import`.
packages = [
    "Factor_Trading_v3_0",
    "Factor_Trading_v3_0.core",
]

[tool.setuptools.package-dir]
"Factor_Trading_v3_0" = "."
"Factor_Trading_v3_0.core" = "core"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# `filter/` 不在类型检查门禁的声明范围内（门禁 target = core）。
# core 会 import filter，mypy（2.4.x）会 follow 并把 filter 的错误计入 —— 故按模块声明
# 「解析类型、但不报告错误」，使门禁结果只反映 core（U-P024-3 / U-P024-4）。
# P-036 更正：这 21 条是 filter 自身的类型错误（`mypy filter` 在 pandas 2.2.3 下同样复现），
# 不是 P-024 记录的「pandas 3.1.1 类型桩」；B3 修完后应移除本 override。
[[tool.mypy.overrides]]
module = ["filter.*"]
ignore_errors = true
