[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-trading-v3"
version = "3.0.0"
description = "Factor Trading v3.0 - A professional quantitative backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Factor Trading v3.0 Team"}
]
keywords = ["quantitative", "trading", "backtesting", "factor", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "cvxpy>=1.2.0",
    "pydantic>=2.0.0",
    "duckdb>=0.10.0",
    "ta>=0.11.0",
    "tushare>=1.2.0",
    "akshare>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "plotly>=5.14.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.5.0",
    "celery>=5.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
factor-trading = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
web = [
    "streamlit>=1.28.0",
]

[project.urls]
"Homepage" = "https://github.com/StormstoutLau/Factor_Trading"
"Repository" = "https://github.com/StormstoutLau/Factor_Trading"
"Issues" = "https://github.com/StormstoutLau/Factor_Trading/issues"

[tool.setuptools]
# TD-1.2 (ADR-016): 最小子包化 — 只声明 factor_pipeline 实际依赖的包
# (根 + core, data_v3 位于 core/ 下). 其他子包 (agents/filter/etc.) 可在
# 需要时追加. Factor_Trading_v3.0 自身仍可在 cwd 下用 `from core.X import`.
packages = [
    "Factor_Trading_v3_0",
    "Factor_Trading_v3_0.core",
]

[tool.setuptools.package-dir]
"Factor_Trading_v3_0" = "."
"Factor_Trading_v3_0.core" = "core"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
